name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (x86_64)
            llvm_tarball: clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          - os: macos-latest
            name: macOS (arm64)
            llvm_tarball: clang+llvm-18.1.8-arm64-apple-darwin22.0.tar.xz
          - os: windows-latest
            name: Windows (x86_64)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      # ── LLVM 18 ──────────────────────────────────────────────────────────────

      - name: Cache LLVM 18 (Linux / macOS)
        if: runner.os != 'Windows'
        id: cache-llvm-unix
        uses: actions/cache@v4
        with:
          path: .llvm/18
          key: llvm-18.1.8-${{ matrix.os }}

      - name: Install LLVM 18 (Linux / macOS)
        if: runner.os != 'Windows' && steps.cache-llvm-unix.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .llvm/18
          curl -fsSL \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/${{ matrix.llvm_tarball }}" \
            | tar xJf - -C .llvm/18 --strip-components=1

      - name: Set LLVM prefix (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "LLVM_SYS_180_PREFIX=$PWD/.llvm/18" >> "$GITHUB_ENV"
          echo "$PWD/.llvm/18/bin"                 >> "$GITHUB_PATH"

      # Windows: the LLVM NSIS installer requires unconditional UAC elevation
      # (even with /S) so we do NOT run it. Instead we set LLVM_SYS_180_PREFIX
      # to a workspace-local directory and let vendor/llvm-sys/build.rs do the
      # download + 7-Zip extraction (no admin needed — see PRs #32 and #33).
      - name: Cache LLVM 18 (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm-windows
        uses: actions/cache@v4
        with:
          path: .llvm\18
          key: llvm-18.1.8-windows-x86_64

      - name: Set LLVM prefix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE\.llvm\18"
          Add-Content $env:GITHUB_ENV  "LLVM_SYS_180_PREFIX=$prefix"
          Add-Content $env:GITHUB_PATH "$prefix\bin"

      # ── Platform-specific deps ────────────────────────────────────────────────

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libvulkan-dev glslang-tools valgrind

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install molten-vk vulkan-headers vulkan-loader glslang

      # Vulkan dev headers are not needed on Windows: ash uses dynamic loading.
      # valgrind is Linux-only; iai-callgrind benches are skipped automatically
      # on other platforms.

      - name: Install iai-callgrind-runner
        if: runner.os == 'Linux'
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked

      # ── Checks ───────────────────────────────────────────────────────────────

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose
