name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install LLVM 18 (pre-built tarball)
        run: |
          mkdir -p .llvm/18
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz \
            | tar xJf - -C .llvm/18 --strip-components=1
          echo "LLVM_SYS_180_PREFIX=$PWD/.llvm/18" >> $GITHUB_ENV
          echo "$PWD/.llvm/18/bin" >> $GITHUB_PATH
      - name: Install Vulkan dev + GLSL compiler + Valgrind
        run: sudo apt-get install -y libvulkan-dev glslang-tools valgrind
      - name: Install iai-callgrind-runner
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
